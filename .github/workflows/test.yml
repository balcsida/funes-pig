name: test
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: extensions/funes/go.mod
      - run: go test -race ./...
        working-directory: extensions/funes
      - run: sh -n setup && sh -n scripts/funes-index.sh
